<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Demo — strict CSP validation</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Demo-host strict CSP validation only.
      This is NOT a mandatory company-wide production policy.
      style-src 'unsafe-inline' is a demo/Angular host limitation (component styles),
      not a library requirement.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
