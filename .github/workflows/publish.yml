name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Unit + architecture tests
        run: npm test

      - name: Build library
        run: npm run build:lib

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./dist/fluxio-image-editor/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Publish to npm
        run: npm publish ./dist/fluxio-image-editor --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
